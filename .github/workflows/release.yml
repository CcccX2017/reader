# Release the single-container image (server + web) to Docker Hub for amd64 and arm64,
# and for a tag, a GitHub release with notes and downloads.
#
#   tag 1.0.13        -> ccccx2022/reader:1.0.13, :latest, :sha-<short>
#                        + GitHub release 1.0.13: notes from the Conventional Commits
#                          since the previous tag (scripts/release-notes.mjs), the
#                          Android APK, the web client zip and SHA256SUMS.txt.
#                          A tag with a pre-release suffix (1.3.0-rc.1) is marked
#                          pre-release and does not become "Latest".
#   manual run        -> :latest and :sha-<short>
#                        :1.0.13 only when this commit is the git tag 1.0.13;
#                        no GitHub release
#
# A local `docker build` on an amd64 machine only produces that one architecture.
# This workflow builds each architecture on its own native runner, pushes the two
# digests, then stitches them into one multi-arch tag. Pulling any of the three
# tags picks amd64 or arm64 from the host.
#
# Never on a plain push: main is the long-lived development branch, and a release
# is a decision (a tag, or "Run workflow" in the Actions tab), not a side effect.
#
# CI (ci.yml) runs first; nothing is published from a red build. The arm64 image
# under QEMU would run npm ci and the Vite build emulated, which is many times slower.
#
# Needs repository secrets DOCKER_USERNAME and DOCKER_PASSWORD (a Docker Hub
# password or access token with read/write on ccccx2022/reader). The APK is
# signed with ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS
# (/ ANDROID_KEY_PASSWORD) when set, otherwise with a debug key (see ci.yml).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ccccx2022/reader

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build:
    name: Image · ${{ matrix.platform }}
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/checkout@v5
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Record digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Image · multi-arch tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            publish_version=true
          else
            version="$(jq -r .version server/package.json)"
            # The version image stays on its git tag. A later commit only moves latest and sha-.
            tagged="$(git ls-remote origin "refs/tags/${version}^{}" | awk 'NR==1 { print $1 }')"
            if [[ -z "$tagged" ]]; then
              tagged="$(git ls-remote origin "refs/tags/${version}" | awk 'NR==1 { print $1 }')"
            fi
            if [[ -n "$tagged" && "$tagged" == "$GITHUB_SHA" ]]; then
              publish_version=true
            else
              publish_version=false
            fi
          fi
          test -n "$version" && [[ "$version" != "null" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_version=$publish_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
            type=sha
          flavor: |
            latest=false
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do
            if [[ "$PUBLISH_VERSION" != "true" && "$tag" == "$IMAGE:$VERSION" ]]; then
              continue
            fi
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
        env:
          PUBLISH_VERSION: ${{ steps.ver.outputs.publish_version }}
          VERSION: ${{ steps.ver.outputs.version }}
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$TAG"
        env:
          TAG: ${{ steps.ver.outputs.publish_version == 'true' && steps.ver.outputs.version || 'latest' }}

  github-release:
    # After the images are live, so the notes never point at a tag Docker Hub lacks.
    name: GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The previous tag and the commits since it, for the notes.
          fetch-depth: 0
      # actions/checkout fetches an annotated tag as a plain ref; fetch it again so
      # its message reaches the notes.
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: reader-android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Assets
        run: |
          version="${TAG#v}"
          (cd web-dist && zip -qr "../dist/reader-web-$version.zip" .)
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          node scripts/release-notes.mjs "$TAG" "$GITHUB_REPOSITORY" > notes.md
          cat notes.md
      # Idempotent: a re-run replaces the notes and assets of an existing release.
      - name: Publish
        run: |
          version="${TAG#v}"
          flags=()
          case "$version" in *-*) flags+=(--prerelease --latest=false) ;; *) flags+=(--prerelease=false --latest) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Reader $version" --notes-file notes.md "${flags[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Reader $version" --notes-file notes.md "${flags[@]}"
          fi
