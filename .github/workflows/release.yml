# Release the single-container image (server + web) to Docker Hub for amd64 and arm64.
#
#   tag 1.0.13        -> ccccx2022/reader:1.0.13, :latest, :sha-<short>
#   manual run        -> :latest and :sha-<short>
#                        :1.0.13 only when this commit is the git tag 1.0.13
#
# A local `docker build` on an amd64 machine only produces that one architecture.
# This workflow builds each architecture on its own native runner, pushes the two
# digests, then stitches them into one multi-arch tag. Pulling any of the three
# tags picks amd64 or arm64 from the host.
#
# Never on a plain push: main is the long-lived development branch, and a release
# is a decision (a tag, or "Run workflow" in the Actions tab), not a side effect.
#
# CI (ci.yml) runs first; nothing is published from a red build. The arm64 image
# under QEMU would run npm ci and the Vite build emulated, which is many times slower.
#
# Needs repository secrets DOCKER_USERNAME and DOCKER_PASSWORD (a Docker Hub
# password or access token with read/write on ccccx2022/reader).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ccccx2022/reader

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Image · ${{ matrix.platform }}
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/checkout@v5
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Record digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Image · multi-arch tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            publish_version=true
          else
            version="$(jq -r .version server/package.json)"
            # The version image stays on its git tag. A later commit only moves latest and sha-.
            tagged="$(git ls-remote origin "refs/tags/${version}^{}" | awk 'NR==1 { print $1 }')"
            if [[ -z "$tagged" ]]; then
              tagged="$(git ls-remote origin "refs/tags/${version}" | awk 'NR==1 { print $1 }')"
            fi
            if [[ -n "$tagged" && "$tagged" == "$GITHUB_SHA" ]]; then
              publish_version=true
            else
              publish_version=false
            fi
          fi
          test -n "$version" && [[ "$version" != "null" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_version=$publish_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
            type=sha
          flavor: |
            latest=false
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do
            if [[ "$PUBLISH_VERSION" != "true" && "$tag" == "$IMAGE:$VERSION" ]]; then
              continue
            fi
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
        env:
          PUBLISH_VERSION: ${{ steps.ver.outputs.publish_version }}
          VERSION: ${{ steps.ver.outputs.version }}
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$TAG"
        env:
          TAG: ${{ steps.ver.outputs.publish_version == 'true' && steps.ver.outputs.version || 'latest' }}
